<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <title>Connexion requise — Bibliothèque Numérique</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #ffffff;
            color: #0f172a;
            text-align: center;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #0f172a; color: #e2e8f0; }
            .btn { background: #3b82f6; }
        }
        main { max-width: 26rem; }
        img { width: 96px; height: auto; margin-bottom: 16px; }
        h1 { font-size: 1.4rem; margin: 0 0 8px; }
        p { margin: 0 0 20px; line-height: 1.5; }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            border: 0;
            border-radius: 12px;
            background: #2563eb;
            color: #ffffff;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <img src="/images/logo-universite-mahajanga.png" alt="Université de Mahajanga">
        <h1>Connexion Internet requise</h1>
        <p>La Bibliothèque Numérique a besoin d'une connexion pour charger vos documents, vos données et l'Assistant IA. Vérifiez votre connexion puis réessayez.</p>
        <button class="btn" type="button" onclick="location.reload()">Réessayer</button>
    </main>
</body>
</html>
